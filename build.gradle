plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

tasks.processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// NeoForge 26.1.x usa Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            )
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { url = 'https://www.cursemaven.com' }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    // Applied Energistics 2 Base (v26.1.x)
    compileOnly "curse.maven:applied-energistics-2-223794:9022271"
    runtimeOnly "curse.maven:applied-energistics-2-223794:9022271"

    implementation "curse.maven:titanium-287342:6443608"
    implementation "curse.maven:guideme-1173950:9022838"

    implementation "curse.maven:athena-841890:5629395"
    implementation "curse.maven:architectury-419699:5786327"
    implementation "curse.maven:owolib-532610:5945693"
    implementation "curse.maven:geckolib-388172:6920810"
    implementation "curse.maven:glodium-957920:5821676"

    implementation "curse.maven:ftlibrary-404465:6466106"
    implementation "curse.maven:ftpessential-410811:6179042"

    implementation "curse.maven:rhino-416294:6000610"
    implementation "curse.maven:kubejs-238086:5810100"
    implementation "curse.maven:jade-324717:6011258"
    implementation "curse.maven:trashcans-394535:5891067"
    implementation "curse.maven:supermarticonfig-438332:5546996"
    implementation "curse.maven:supermarticore-454372:6076757"

    // ExtendedAE
    compileOnly "curse.maven:extendedae-892005:8698967"

    // ExtendedAE Plus
    compileOnly "curse.maven:extendedae-1337639:9006822"

    // AdvancedAE
    compileOnly "curse.maven:advancedae-1084104:8603081"

    compileOnly "curse.maven:jei-238222:8870333"

    compileOnly "curse.maven:ae2-wcwt-1546802:8970875"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("file://${project.projectDir}/repo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}